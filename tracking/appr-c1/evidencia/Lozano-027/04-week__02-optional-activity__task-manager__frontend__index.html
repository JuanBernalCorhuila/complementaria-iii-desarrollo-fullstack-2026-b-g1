<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Task Manager</h1>
    <p id="task-summary" class="summary" aria-live="polite"></p>
  </header>

  <main class="container">
    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-title"
        name="title"
        placeholder="What do you need to do?"
        autocomplete="off"
        required
      />
      <button type="submit">+ Add task</button>
    </form>

    <!-- Loading state -->
    <section id="state-loading" class="state-block" hidden>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>

    <!-- Error state -->
    <section id="state-error" class="state-block error-banner" hidden>
      <p id="error-message">Could not load tasks. Check your connection and try again.</p>
      <button id="retry-button" type="button">Retry</button>
    </section>

    <!-- Empty state -->
    <section id="state-empty" class="state-block empty-banner" hidden>
      <p>No tasks yet. Add your first one above.</p>
    </section>

    <!-- Data state -->
    <ul id="task-list" class="task-list" hidden></ul>
  </main>

  <template id="task-item-template">
    <li class="task-item" data-id="">
      <button class="status-toggle" type="button" aria-label="Toggle status"></button>
      <div class="task-content">
        <p class="task-title"></p>
        <p class="task-date"></p>
      </div>
      <span class="status-badge"></span>
      <button class="delete-button" type="button">Delete</button>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
