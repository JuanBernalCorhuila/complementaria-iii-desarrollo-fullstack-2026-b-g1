<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Componente React · Lista de Tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #101322;
      --panel: #1a1e33;
      --accent: #7c9cff;
      --text: #eef0fb;
      --muted: #9098bd;
      --font-display: 'Sora', sans-serif;
      --font-body: 'Manrope', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 0.85rem;
      margin: 0 0 0.75rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.9rem;
      margin: 0 0 0.5rem;
    }
    .lead {
      color: var(--muted);
      margin: 0 0 1.75rem;
    }
    .task-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .task-item {
      background: var(--panel);
      border-radius: 8px;
      padding: 0.85rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
    }
    .task-status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .task-status.done { background: #58d68d; }
    .task-status.pending { background: #f4b942; }
    .loading-box {
      color: var(--muted);
      padding: 2rem 0;
    }
    .refresh-btn {
      background: var(--accent);
      color: #0c1023;
      border: none;
      padding: 0.6rem 1.15rem;
      border-radius: 6px;
      font-family: var(--font-body);
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 1.25rem;
    }
    .refresh-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Componente que recibe datos de la API y los muestra como lista.
    function TaskList({ tasks }) {
      return (
        <ul className="task-list">
          {tasks.map((task) => (
            <li key={task.id} className="task-item">
              <span className={`task-status ${task.completed ? 'done' : 'pending'}`}></span>
              <span>{task.title}</span>
            </li>
          ))}
        </ul>
      );
    }

    function App() {
      const [tasks, setTasks] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const fetchTasks = () => {
        setLoading(true);
        setError(null);

        fetch('https://jsonplaceholder.typicode.com/todos?_limit=8')
          .then((res) => {
            if (!res.ok) throw new Error(`Error del servidor: ${res.status}`);
            return res.json();
          })
          .then((data) => {
            setTasks(data);
            setLoading(false);
          })
          .catch((err) => {
            setError(err.message);
            setLoading(false);
          });
      };

      useEffect(() => {
        fetchTasks();
      }, []);

      return (
        <div className="wrap">
          <p className="eyebrow">Actividad 4 · Componente React</p>
          <h1>Lista de tareas</h1>
          <p className="lead">
            Componente con estado propio (useState) que consume una API pública
            (useEffect) y renderiza la lista recibida.
          </p>

          <button className="refresh-btn" onClick={fetchTasks} disabled={loading}>
            {loading ? 'Cargando…' : 'Actualizar tareas'}
          </button>

          {loading && <p className="loading-box">Cargando tareas…</p>}
          {error && !loading && <p className="loading-box">Error: {error}</p>}
          {!loading && !error && <TaskList tasks={tasks} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
