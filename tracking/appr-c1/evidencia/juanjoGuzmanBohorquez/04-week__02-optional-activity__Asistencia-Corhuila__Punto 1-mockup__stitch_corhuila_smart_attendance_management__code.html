<!-- Navigation shell suppressed because this is a focused task screen. -->
<script>
        // Simple script to handle visual feedback on save (optional UX enhancement)
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            const originalText = this.innerHTML;
            this.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">check_circle</span> Guardado';
            this.classList.replace('bg-primary', 'bg-success');
            
            setTimeout(() => {
                this.innerHTML = originalText;
                this.classList.replace('bg-success', 'bg-primary');
            }, 2000);
        });
