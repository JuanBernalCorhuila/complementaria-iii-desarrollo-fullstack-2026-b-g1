<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Ledger — task-manager (tm)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="page">

    <header class="masthead">
      <div class="masthead__title-row">
        <h1 class="masthead__title">Task Ledger</h1>
        <span class="masthead__mark">tm</span>
      </div>
      <p class="masthead__tagline">One line per task. Mark it done when it's done.</p>
    </header>

    <main class="ledger" id="ledger">

      <!-- New entry composer -->
      <form class="composer" id="composer" novalidate>
        <label class="composer__label" for="task-input">New entry</label>
        <div class="composer__row">
          <input
            type="text"
            id="task-input"
            class="composer__input"
            placeholder="Write a task…"
            autocomplete="off"
            maxlength="120"
            required
          />
          <button type="submit" class="composer__submit" id="composer-submit">
            Add
          </button>
        </div>
        <p class="composer__hint" id="composer-hint" role="alert"></p>
      </form>

      <!-- Filter tabs -->
      <nav class="tabs" aria-label="Filter tasks">
        <button class="tabs__item is-active" data-filter="all" type="button">All</button>
        <button class="tabs__item" data-filter="pending" type="button">Pending</button>
        <button class="tabs__item" data-filter="completed" type="button">Completed</button>
        <span class="tabs__count" id="tabs-count"></span>
      </nav>

      <!-- States: loading / error / empty / list live here -->
      <section class="entries" id="entries" aria-live="polite">
        <!-- populated by js/ui.js -->
      </section>

    </main>

    <footer class="colophon">
      <p>Data from <a href="https://dummyjson.com/docs/todos" target="_blank" rel="noopener">DummyJSON Todos API</a>. Changes to seeded items are not persisted server-side.</p>
    </footer>

  </div>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
