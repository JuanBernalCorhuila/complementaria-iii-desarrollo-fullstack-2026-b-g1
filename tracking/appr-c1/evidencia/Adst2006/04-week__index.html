<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio de Usuarios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Directorio de Usuarios</h1>
      <button id="reload-btn">Cargar Usuarios</button>
    </header>

    <main>
      <!-- Estado 1: Carga -->
      <div id="loading" class="state-message hidden">
        <div class="spinner"></div>
        <p>Cargando datos desde la API...</p>
      </div>

      <!-- Estado 2: Error -->
      <div id="error" class="state-message hidden">
        <p class="error-text">❌ Ocurrió un error al obtener los datos.</p>
        <button id="retry-btn">Reintentar</button>
      </div>

      <!-- Estado 3: Datos cargados -->
      <div id="user-list" class="user-grid"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
