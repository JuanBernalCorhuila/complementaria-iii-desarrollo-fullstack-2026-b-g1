spring.application.name=videojuegos-api
server.port=8080

# Base de datos H2 en memoria (se borra al detener la app)
spring.datasource.url=jdbc:h2:mem:videojuegosdb
spring.jpa.hibernate.ddl-auto=create-drop

# JWT: clave secreta para firmar los tokens (minimo 32 caracteres) y su duracion (1 hora)
jwt.secret=clave-secreta-videojuegos-api-corhuila-2026
jwt.expiracion-ms=3600000
