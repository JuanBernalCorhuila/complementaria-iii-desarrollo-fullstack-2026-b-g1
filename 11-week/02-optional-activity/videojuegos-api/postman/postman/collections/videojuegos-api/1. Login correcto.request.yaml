$kind: http-request
url: http://localhost:8080/api/auth/login
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "usuario": "admin",
      "clave": "admin123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      // Guarda el token en la variable {{token}} para usarlo en las siguientes peticiones
      if (pm.response.code === 200) {
          pm.collectionVariables.set("token", pm.response.json().token);
      }
    language: text/javascript
order: 1000
