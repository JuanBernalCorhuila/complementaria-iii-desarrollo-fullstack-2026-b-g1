$kind: http-request
url: http://localhost:8080/api/videojuegos
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Red Dead Redemption 2",
      "genero": "Aventura",
      "plataforma": "PS4",
      "precio": 149900,
      "anioLanzamiento": 2018
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 4000
