spring.application.name=videojuegos-api
server.port=8080

# Toda la configuracion que cambia entre mi equipo y la nube sale de variables de entorno.
# Formato: ${VARIABLE:valor por defecto}. Si no hay valor por defecto, la variable es obligatoria.

# Base de datos: por defecto H2 en memoria (se borra al detener la app)
spring.datasource.url=${DB_URL:jdbc:h2:mem:videojuegosdb}
spring.jpa.hibernate.ddl-auto=create-drop

# JWT: la clave secreta NO va en el codigo; es obligatoria (minimo 32 caracteres). El token dura 1 hora
jwt.secret=${JWT_SECRET}
jwt.expiracion-ms=${JWT_EXPIRACION_MS:3600000}

# CORS: origen (direccion) del frontend que puede llamar a la API desde el navegador
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
